<style>

/* =========================================================
   DIKICHI
   PRODUCT QUALITY INTELLIGENCE
   EXECUTIVE DASHBOARD
   BRAND DESIGN SYSTEM
   ========================================================= */


/* =========================================================
   01. ROOT / BRAND TOKENS
   ========================================================= */

:root {

  /* -------------------------------------------------------
     DIKICHI BRAND
     Palette sampled from D:\05 PROJECT\11 PROJECT PPA\10 Dikichi Dashboard\Assets\logo dikichi.jpg
     ------------------------------------------------------- */
  --dikichi-pink: #FF7CBE;
  --dikichi-pink-deep: #C2187D;
  --dikichi-pink-dark: #8E0B57;
  --dikichi-pink-soft: #FFEBF5;
  --dikichi-purple: #84438D;
  --dikichi-purple-deep: #572B7A;
  --dikichi-purple-soft: #F4EAF7;
  --dikichi-ink: #2E1440;
  --dikichi-ink-deep: #1B0B2A;
  --bg: #FBF6FA;
  --bg-warm: #F8F3F9;
  --surface: #FFFFFF;
  --surface-soft: #FEFBFE;
  --surface-warm: #FDFAFD;
  --border: #EEDFEE;
  --border-light: #F5EDF5;
  --border-strong: #DCC7DE;
  --text: #2B1233;
  --text-secondary: #5C4463;
  --text-muted: #6D5975;
  --text-light: #88788F;
  --grade-high: #009B72;
  --grade-high-soft: #E0F3EB;
  --grade-high-border: #B7E5D4;
  --grade-middle: #0E9AA7;
  --grade-middle-soft: #E7F7F6;
  --grade-middle-border: #B9E5E3;
  --grade-borderline: #E58A00;
  --grade-borderline-soft: #FFF3DE;
  --grade-borderline-border: #F4D39E;
  --grade-middle-fail: #E84B16;
  --grade-middle-fail-soft: #FDECE5;
  --grade-middle-fail-border: #F5C2B0;
  --grade-strong-fail: #D92755;
  --grade-strong-fail-soft: #FCE8EE;
  --grade-strong-fail-border: #F3B7C7;
  --grade-high-text: #007D5C;
  --grade-middle-text: #0B7983;
  --grade-borderline-text: #9E5F00;
  --grade-middle-fail-text: #C43F13;
  --grade-strong-fail-text: #D02552;
  --mx-amber-text: #A25D00;
  --gray-muted-text: #746A79;
  --gray-faint-text: #736B75;
  --gray-title-text: #746A7A;
  --primary: var(--dikichi-pink);
  --primary-soft: var(--dikichi-pink-soft);
  --success: var(--grade-high);
  --success-soft: var(--grade-high-soft);
  --warning: var(--grade-borderline);
  --warning-soft: var(--grade-borderline-soft);
  --danger: var(--grade-middle-fail);
  --danger-soft: var(--grade-middle-fail-soft);
  --info: var(--dikichi-pink);
  --info-soft: var(--dikichi-pink-soft);
  --shadow-xs: 0 1px 2px rgba(27, 11, 42, 0.035);
  --shadow-sm: 0 2px 8px rgba(27, 11, 42, 0.055);
  --shadow-md: 0 8px 26px rgba(27, 11, 42, 0.085);
  --shadow-lg: 0 18px 48px rgba(27, 11, 42, 0.12);
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --dikichi-purple-light: #FEF3F9;
  --dikichi-purple-dark-soft: #F9D9EC;
  --color-plum: var(--dikichi-pink-deep);
  --surface-2: var(--surface-soft);
  --text-primary: var(--text);
}


/* =========================================================
   02. GLOBAL RESET
   ========================================================= */

* {
  box-sizing:
    border-box;
}


html {

  margin:
    0;

  padding:
    0;

  background:
    var(--bg);

  scroll-behavior:
    smooth;

}


body {

  margin:
    0;

  padding:
    0;

  background:
    linear-gradient(
      180deg,
      #F5F7F9 0%,
      #F3F5F7 100%
    );

  color:
    var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  font-size:
    14px;

  line-height:
    1.5;

  -webkit-font-smoothing:
    antialiased;

}


button,
select,
input {

  font-family:
    inherit;

}


button {

  cursor:
    pointer;

}


button:focus-visible,
select:focus-visible,
input:focus-visible {

  outline:
    2px solid
    var(--dikichi-pink-deep);

  outline-offset:
    2px;

}


/* =========================================================
   03. APP
   ========================================================= */

.app {

  min-height:
    100vh;

}


/* =========================================================
   04. TOPBAR
   ========================================================= */

.topbar {

  position:
    sticky;

  top:
    0;

  z-index:
    100;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    24px;

  min-height:
    76px;

  padding:
    13px 32px;

  background:
    rgba(87, 43, 122, 0.97);

  border-bottom:
    1px solid
    rgba(255, 255, 255, 0.08);

  color:
    #FFFFFF;

  box-shadow:
    0 2px 16px
    rgba(46, 20, 64, 0.13);

  backdrop-filter:
    blur(14px);

}


.brand {

  display:
    flex;

  align-items:
    center;

  gap:
    13px;

  min-width:
    0;

}


/* ---------------------------------------------------------
   LOGO CONTAINER
   --------------------------------------------------------- */

.brand-mark {

  position:
    relative;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    44px;

  height:
    44px;

  flex:
    0 0 44px;

  overflow:
    hidden;

  border:
    1px solid
    rgba(245, 241, 223, 0.35);

  border-radius:
    11px;

  background:
    var(--dikichi-purple-soft);

  color:
    var(--dikichi-pink-deep);

  font-size:
    18px;

  font-weight:
    800;

  letter-spacing:
    -0.04em;

}


/*
  When index.html is updated to use the real logo:

  <div class="brand-mark">
    <img src="..." alt="Dikichi">
  </div>

  this styling will automatically apply.
*/

.brand-mark img {

  display:
    block;

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;

}


/* ---------------------------------------------------------
   BRAND TEXT
   --------------------------------------------------------- */

.brand-name {

  color:
    var(--dikichi-purple-soft);

  font-size:
    13px;

  line-height:
    1.2;

  font-weight:
    800;

  letter-spacing:
    0.1em;

}


.brand-subtitle {

  margin-top:
    3px;

  color:
    rgba(255, 255, 255, 0.90);

  font-size:
    11px;

}


.header-status {

  display:
    flex;

  align-items:
    center;

  gap:
    14px;

}


.live-status {

  display:
    flex;

  align-items:
    center;

  gap:
    7px;

  color:
    #7DE0BD;

  font-size:
    10px;

  font-weight:
    800;

  letter-spacing:
    0.1em;

}


.live-dot {

  width:
    7px;

  height:
    7px;

  border-radius:
    50%;

  background:
    #45D5A5;

  box-shadow:
    0 0 0 4px
    rgba(69, 213, 165, 0.14);

}


.last-updated {

  color:
    rgba(255, 255, 255, 0.80);

  font-size:
    11px;

}


.refresh-button {

  display:
    inline-flex;

  align-items:
    center;

  gap:
    6px;

  min-height:
    34px;

  padding:
    0 11px;

  border:
    1px solid
    rgba(255, 255, 255, 0.18);

  border-radius:
    8px;

  background:
    rgba(255, 255, 255, 0.07);

  color:
    #FFFFFF;

  font-size:
    11px;

  font-weight:
    650;

  transition:
    160ms ease;

}


.refresh-button:hover {

  background:
    rgba(245, 241, 223, 0.14);

  border-color:
    rgba(245, 241, 223, 0.35);

}


.refresh-icon {

  display:
    inline-block;

  font-size:
    16px;

  line-height:
    1;

}


.refresh-button.is-loading .refresh-icon {

  animation:
    spin 0.9s linear infinite;

}


@keyframes spin {

  from {

    transform:
      rotate(0deg);

  }

  to {

    transform:
      rotate(360deg);

  }

}


/* =========================================================
   05. MAIN CONTAINER
   ========================================================= */

.dashboard-container {

  width:
    min(1480px, calc(100% - 64px));

  margin:
    0 auto;

  padding:
    32px 0 64px;

}


/* =========================================================
   06. SECTION HEADER
   ========================================================= */

.section-header {

  display:
    flex;

  align-items:
    flex-end;

  justify-content:
    space-between;

  gap:
    32px;

  margin-bottom:
    22px;

}


.section-header h1 {

  margin:
    5px 0 7px;

  color:
    var(--dikichi-ink-deep);

  font-size:
    clamp(25px, 3vw, 34px);

  line-height:
    1.12;

  letter-spacing:
    -0.045em;

}


.section-header p {

  max-width:
    680px;

  margin:
    0;

  color:
    var(--text-secondary);

  font-size:
    13px;

}


.eyebrow {

  color:
    var(--dikichi-pink-deep);

  font-size:
    10px;

  font-weight:
    850;

  letter-spacing:
    0.13em;

  text-transform:
    uppercase;

  margin-bottom:
    3px;

}


/* ---------------------------------------------------------
   SECTION LAYOUT - spacing & rhythm
   --------------------------------------------------------- */

.dashboard-section {

  margin-top:
    0;

  margin-bottom:
    28px;

}


.section-title-block {

  margin-bottom:
    14px;

}


.section-title-block .eyebrow {

  margin-bottom:
    4px;

}


.section-title-block h2 {

  margin:
    0 0 4px;

  color:
    var(--dikichi-ink-deep);

  font-size:
    20px;

  font-weight:
    700;

  letter-spacing:
    -0.03em;

  line-height:
    1.2;

}


.section-title-block p {

  margin:
    0;

  color:
    var(--text-secondary);

  font-size:
    12px;

  line-height:
    1.5;

}


.data-status {

  display:
    flex;

  flex-direction:
    column;

  align-items:
    flex-end;

  gap:
    3px;

  padding-bottom:
    4px;

}


.status-label {

  color:
    var(--gray-title-text);

  font-size:
    9px;

  font-weight:
    800;

  letter-spacing:
    0.1em;

}


.status-value {

  color:
    var(--text-secondary);

  font-size:
    12px;

  font-weight:
    650;

}


/* =========================================================
   07. FILTER BAR
   ========================================================= */

.filter-bar {

  display:
    flex;

  align-items:
    flex-end;

  flex-wrap:
    wrap;

  gap:
    12px;

  margin-bottom:
    20px;

  padding:
    15px;

  background:
    rgba(255, 255, 255, 0.94);

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius-md);

  box-shadow:
    var(--shadow-xs);

}


.filter-group {

  display:
    flex;

  flex-direction:
    column;

  gap:
    5px;

  min-width:
    170px;

}


.filter-group label {

  color:
    var(--gray-title-text);

  font-size:
    9px;

  font-weight:
    850;

  letter-spacing:
    0.1em;

  text-transform:
    uppercase;

}


.filter-group select {

  height:
    39px;

  padding:
    0 32px 0 11px;

  border:
    1px solid
    var(--border-strong);

  border-radius:
    8px;

  background:
    #FFFFFF;

  color:
    var(--text);

  font-size:
    12px;

  cursor:
    pointer;

  transition:
    140ms ease;

}


.filter-group select:hover {

  border-color:
    var(--dikichi-pink-deep);

}


.filter-group select:focus {

  border-color:
    var(--dikichi-pink-deep);

  box-shadow:
    0 0 0 3px
    rgba(87, 43, 122, 0.08);

}


/* ---------------------------------------------------------
   FILTER RESET
   --------------------------------------------------------- */

.filter-reset {

  margin-left:
    auto;

}


.filter-reset button {

  height:
    39px;

  padding:
    0 13px;

  border:
    1px solid
    var(--border);

  border-radius:
    8px;

  background:
    var(--dikichi-pink-soft);

  color:
    var(--dikichi-pink-deep);

  font-size:
    11px;

  font-weight:
    700;

  transition:
    140ms ease;

}


.filter-reset button:hover {

  background:
    var(--dikichi-pink-deep);

  color:
    #FFFFFF;

}


/* =========================================================
   08. STANDARD / GRADE LEGEND
   ========================================================= */

.grade-standard,
.standards-legend,
.grade-legend {

  display:
    flex;

  align-items:
    center;

  justify-content:
    flex-end;

  flex-wrap:
    wrap;

  gap:
    7px;

  margin-bottom:
    20px;

}


.grade-standard-label,
.standards-label {

  margin-right:
    4px;

  color:
    var(--gray-title-text);

  font-size:
    9px;

  font-weight:
    800;

  letter-spacing:
    0.08em;

  text-transform:
    uppercase;

}


.standard-item,
.legend-item {

  display:
    inline-flex;

  align-items:
    center;

  gap:
    5px;

  padding:
    4px 7px;

  border-radius:
    5px;

  font-size:
    9px;

  font-weight:
    750;

}


.standard-high {

  background:
    var(--grade-high-soft);

  color:
    var(--grade-high-text);

}


.standard-middle {

  background:
    var(--grade-middle-soft);

  color:
    var(--grade-middle-text);

}


.standard-borderline {

  background:
    var(--grade-borderline-soft);

  color:
    var(--grade-borderline-text);

}


.standard-fail {

  background:
    var(--grade-middle-fail-soft);

  color:
    var(--grade-middle-fail-text);

}


.standard-strong-fail {

  background:
    var(--grade-strong-fail-soft);

  color:
    var(--grade-strong-fail-text);

}


/* =========================================================
   09. KPI GRID
   ========================================================= */

.kpi-grid {

  display:
    grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap:
    14px;

  margin-bottom:
    20px;

}


/* =========================================================
   KPI CARD
   ========================================================= */

.kpi-card {

  position:
    relative;

  min-height:
    166px;

  padding:
    21px;

  overflow:
    hidden;

  background:
    var(--surface);

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius-lg);

  box-shadow:
    var(--shadow-sm);

  transition:
    170ms ease;

}


.kpi-card:hover {

  transform:
    translateY(-1px);

  box-shadow:
    var(--shadow-md);

}


.kpi-card::after {

  content:
    "";

  position:
    absolute;

  right:
    -34px;

  bottom:
    -42px;

  width:
    125px;

  height:
    125px;

  border:
    1px solid
    rgba(87, 43, 122, 0.045);

  border-radius:
    50%;

  background:
    rgba(87, 43, 122, 0.025);

}


/* ---------------------------------------------------------
   QUALITY STANDARD
   --------------------------------------------------------- */

.quality-standard {

  display:
    flex;

  align-items:
    center;

  justify-content:
    flex-end;

  gap:
    12px;

  margin:
    4px 0 22px;

  flex-wrap:
    wrap;

}

.quality-standard-title {

  color:
    #746A7A;

  font-size:
    9px;

  font-weight:
    850;

  letter-spacing:
    0.13em;

  white-space:
    nowrap;

}

.quality-standard-items {

  display:
    flex;

  align-items:
    center;

  justify-content:
    flex-end;

  gap:
    7px;

  flex-wrap:
    wrap;

}

.standard {

  display:
    inline-flex;

  align-items:
    center;

  min-height:
    24px;

  padding:
    0 9px;

  border:
    1px solid transparent;

  border-radius:
    6px;

  font-size:
    8px;

  font-weight:
    800;

  letter-spacing:
    0.02em;

  white-space:
    nowrap;

}

.standard.high {

  color:
    var(--grade-high-text);

  background:
    var(--grade-high-soft);

  border-color:
    var(--grade-high-border);

}

.standard.middle {

  color:
    var(--grade-middle-text);

  background:
    var(--grade-middle-soft);

  border-color:
    var(--grade-middle-border);

}

.standard.borderline {

  color:
    var(--grade-borderline-text);

  background:
    var(--grade-borderline-soft);

  border-color:
    var(--grade-borderline-border);

}

.standard.fail {

  color:
    var(--grade-middle-fail-text);

  background:
    var(--grade-middle-fail-soft);

  border-color:
    var(--grade-middle-fail-border);

}

.standard.strong-fail {

  color:
    var(--grade-strong-fail-text);

  background:
    var(--grade-strong-fail-soft);

  border-color:
    var(--grade-strong-fail-border);

}


/* ---------------------------------------------------------
   NO-DATA GRADE BADGE
   --------------------------------------------------------- */

.grade-no-data {

  color:
    #68737D;

  background:
    #F0F3F5;

  border-color:
    #DDE3E7;

}


/* ---------------------------------------------------------
   PRIMARY KPI
   --------------------------------------------------------- */

.primary-card {

  background:
    linear-gradient(
      135deg,
      var(--dikichi-ink-deep) 0%,
      var(--dikichi-pink-deep) 100%
    );

  border-color:
    var(--dikichi-pink-deep);

  color:
    #FFFFFF;

  box-shadow:
    0 8px 28px
    rgba(87, 43, 122, 0.18);

}


.primary-card::after {

  width:
    160px;

  height:
    160px;

  right:
    -54px;

  bottom:
    -66px;

  border-color:
    rgba(245, 241, 223, 0.08);

  background:
    rgba(245, 241, 223, 0.035);

}


/* ---------------------------------------------------------
   ATTENTION KPI
   --------------------------------------------------------- */

.attention-card {

  border-left:
    3px solid
    var(--grade-borderline);

}


.attention-card::before {

  content:
    "!";

  position:
    absolute;

  top:
    17px;

  right:
    18px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    25px;

  height:
    25px;

  border:
    1px solid
    var(--grade-borderline-border);

  border-radius:
    50%;

  background:
    var(--grade-borderline-soft);

  color:
    var(--grade-borderline-text);

  font-size:
    13px;

  font-weight:
    850;

  z-index:
    2;

}


.kpi-label {

  position:
    relative;

  z-index:
    1;

  color:
    var(--gray-title-text);

  font-size:
    9px;

  font-weight:
    850;

  letter-spacing:
    0.1em;

  text-transform:
    uppercase;

}


.primary-card .kpi-label {

  color:
    rgba(255, 255, 255, 0.90);

}


.kpi-value {

  position:
    relative;

  z-index:
    1;

  margin-top:
    13px;

  color:
    var(--text);

  font-size:
    35px;

  line-height:
    1;

  font-weight:
    780;

  letter-spacing:
    -0.055em;

}


.primary-card .kpi-value {

  color:
    #FFFFFF;

  font-size:
    43px;

}


/* ---------------------------------------------------------
   SCORE / 5
   --------------------------------------------------------- */

.score-out-of {

  position:
    relative;

  z-index:
    1;

  margin-left:
    4px;

  color:
    var(--gray-title-text);

  font-size:
    12px;

  font-weight:
    650;

  letter-spacing:
    0;

}


.primary-card .score-out-of {

  color:
    rgba(255, 255, 255, 0.92);

}


.attention-value {

  font-size:
    23px;

  line-height:
    1.2;

  letter-spacing:
    -0.035em;

}


/* ---------------------------------------------------------
   KPI GRADE
   --------------------------------------------------------- */

.kpi-grade {

  position:
    relative;

  z-index:
    1;

  display:
    inline-flex;

  margin-top:
    9px;

  padding:
    4px 8px;

  border-radius:
    5px;

  background:
    var(--dikichi-pink-soft);

  color:
    var(--dikichi-pink-deep);

  font-size:
    9px;

  font-weight:
    850;

  letter-spacing:
    0.05em;

}


.primary-card .kpi-grade {

  background:
    rgba(245, 241, 223, 0.14);

  color:
    var(--dikichi-purple-soft);

}


/* ---------------------------------------------------------
   KPI DESCRIPTION
   --------------------------------------------------------- */

.kpi-description {

  position:
    relative;

  z-index:
    1;

  margin-top:
    10px;

  color:
    var(--gray-title-text);

  font-size:
    10px;

}


.primary-card .kpi-description {

  color:
    rgba(255, 255, 255, 0.92);

}

   FAIL RATE EXPLANATION
   --------------------------------------------------------- */

.fail-rate-explanation {

  max-width:
    280px;

  margin-top:
    7px;

  color:
    var(--gray-title-text);

  font-size:
    10px;

  line-height:
    1.45;

}

   10. PERIOD COMPARISON
   ========================================================= */

.comparison-section {

  margin-bottom:
    20px;

}


.section-title-row {

  display:
    flex;

.comparison-header {

   --------------------------------------------------------- */

.comparison-score {

.comparison-score .likert-value {

    11px;

    650;

  letter-spacing:
    0;

}


/* ---------------------------------------------------------

   --------------------------------------------------------- */

.comparison-difference {

  margin-top:
    8px;

  color:
    var(--text-secondary);

    11px;

  font-weight:
    750;

}


.comparison-difference.positive {

}


.comparison-difference.negative {

  color:

}


.comparison-difference.neutral {

}


.comparison-meta {

  margin-top:
    6px;

  color:
    var(--gray-title-text);

    10px;

/* =========================================================
   11. PANELS
   ========================================================= */

/* ---------------------------------------------------------
   PRODUCT + GRADE SIDE-BY-SIDE GRID
   --------------------------------------------------------- */

.product-grade-grid {

  display:
    grid;

  grid-template-columns:
    3fr 2fr;

  gap:
    12px;

  align-items:
    start;

}


.grade-panel {

  display:
    flex;

  flex-direction:
    column;

}


.rank-cell {

  width:
    32px;

  color:
    var(--gray-title-text);

  font-size:
    11px;

  font-weight:
    700;

  text-align:
    center;

}


@media (max-width: 900px) {

  .product-grade-grid {

    grid-template-columns:
      1fr;

  }

  .grade-panel {

    position:
      static;

  }

}


/* ---------------------------------------------------------
   MULTI-SELECT FILTER
   --------------------------------------------------------- */

.multi-select {

  position:
    relative;

  min-width:
    120px;

}


.multi-select-trigger {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    6px;

  padding:
    0 10px;

  height:
    34px;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    6px;

  cursor:
    pointer;

  user-select:
    none;

  font-size:
    12px;

  color:
    var(--text);

}


.multi-select-trigger:hover {

  border-color:
    var(--border-strong);

}


.multi-select.is-open .multi-select-trigger {

  border-color:
    var(--dikichi-pink-deep);

  box-shadow:
    0 0 0 2px var(--dikichi-pink-soft);

}


.multi-select-label {

  overflow:
    hidden;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  max-width:
    140px;

}


.multi-select-arrow {

  flex:
    0 0 auto;

  font-size:
    10px;

  color:
    var(--gray-title-text);

  transition:
    transform 0.15s;

}


.multi-select.is-open .multi-select-arrow {

  transform:
    rotate(180deg);

}


.multi-select-dropdown {

  display:
    none;

  position:
    absolute;

  top:
    calc(100% + 4px);

  left:
    0;

  min-width:
    100%;

  max-height:
    220px;

  overflow-y:
    auto;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    8px;

  box-shadow:
    0 4px 16px rgba(0,0,0,0.10);

  z-index:
    200;

  padding:
    4px 0;

}


.multi-select.is-open .multi-select-dropdown {

  display:
    block;

}


.multi-select-option {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  padding:
    7px 12px;

  font-size:
    12px;

  color:
    var(--text);

  cursor:
    pointer;

}


.multi-select-option:hover {

  background:
    var(--surface-soft);

}


.multi-select-option input[type="checkbox"] {

  margin:
    0;

  accent-color:
    var(--dikichi-pink-deep);

}


.multi-select-option.is-all {

  border-bottom:
    1px solid var(--border-light);

  font-weight:
    600;

  margin-bottom:
    2px;

}


/* ---------------------------------------------------------
   AUDIT EXPLORER - rich table additions
   --------------------------------------------------------- */

.audit-search-bar {

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  margin-bottom:
    12px;

}


.audit-search-input {

  padding:
    7px 12px;

  border:
    1px solid var(--border);

  border-radius:
    6px;

  font-size:
    12px;

  color:
    var(--text);

  background:
    var(--surface);

  outline:
    none;

}


.audit-search-input:focus {

  border-color:
    var(--dikichi-pink-deep);

  box-shadow:
    0 0 0 2px var(--dikichi-pink-soft);

}


.audit-record-count {

  font-size:
    11px;

  color:
    var(--gray-title-text);

  white-space:
    nowrap;

}


.doc-link {

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    26px;

  height:
    26px;

  border-radius:
    5px;

  background:
    var(--dikichi-pink-soft);

  color:
    var(--dikichi-pink-deep);

  font-size:
    13px;

  text-decoration:
    none;

  margin-right:
    2px;

}


.doc-link:hover {

  background:
    var(--grade-high-soft);

}


th.sortable {

  cursor:
    pointer;

  user-select:
    none;

}


th.sortable:hover {

  color:
    var(--dikichi-pink-deep);

}


th.sort-asc::after {

  content:

}


th.sort-desc::after {

  content:
    " -";

  font-size:
    9px;

}


.panel {

  margin-bottom:
    20px;

  padding:
    20px;

  background:
    rgba(255, 255, 255, 0.96);

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius-lg);

  box-shadow:
    var(--shadow-xs);

}


.panel-header {

  display:
    flex;

  align-items:
    flex-start;

  justify-content:
    space-between;

  gap:
    20px;

  margin-bottom:
    16px;

}


.panel-header h2 {

  margin:
    4px 0 0;

  color:
    var(--dikichi-ink-deep);

  font-size:
    18px;

  line-height:
    1.25;

  letter-spacing:
    -0.03em;

}


.panel-description {

  margin:

  color:

    11px;

}


.panel-action {

.panel-action:hover {

/* =========================================================

  height:

}


.product-performance-card:hover {

  transform:
    translateY(-1px);

}

   --------------------------------------------------------- */

.product-rank {

  display:
    inline-flex;

.product-performance-score {

  color:

    800;

.product-performance-score small {

    var(--gray-title-text);

    10px;

    650;

    0;

}


/* ---------------------------------------------------------

   --------------------------------------------------------- */

.score-progress {

  width:
    100%;

  height:

}


.score-progress-bar {

  height:
    100%;

  border-radius:
    inherit;

  background:

  transition:
    width

}

.attribute-breakdown {

  display:
    grid;

  grid-template-columns:
    repeat(

      minmax(115px, 1fr)

    16px;

  padding-top:
    14px;

  background:
    #FFFFFF;

  border:
    1px solid
    var(--border);

    9px;

  color:
    var(--text-secondary);

  font-size:
    10px;

}


.attribute-card-score {

  margin-top:
    3px;

  color:
    var(--dikichi-ink-deep);

  font-size:
    16px;

  font-weight:
    800;

}


.attribute-card-meta {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  margin-top:
    4px;

  color:
    var(--gray-title-text);

  font-size:
    9px;

}


/* =========================================================
   16. GRADE BADGES
   ========================================================= */

.grade-badge {

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

    4px 8px;

  font-weight:

  letter-spacing:

.grade-high-pass {

    var(--grade-high-text);

.grade-middle-pass {

  background:
    var(--grade-middle-soft);

  color:
    var(--grade-middle-text);

    var(--grade-borderline-soft);

  border-color:
    var(--grade-borderline-border);

    var(--grade-borderline-text);

}


.grade-middle-fail {

    var(--grade-middle-fail-soft);

    var(--grade-middle-fail-border);

}


.grade-strong-fail {

  background:
    var(--grade-strong-fail-soft);

    var(--grade-strong-fail-border);

    var(--grade-strong-fail-text);

    var(--grade-middle-text);

}

.kpi-grade.grade-borderline {

  color:
    var(--grade-borderline-text);

}

.kpi-grade.grade-middle-fail {

  color:
    var(--grade-middle-fail-text);

}

.kpi-grade.grade-strong-fail {

  color:
    var(--grade-strong-fail-text);

}

    pointer;

}


.attention-indicator {

    inline-block;

  height:

    var(--grade-middle-fail-soft);

    left;

    9px;

    100%;

    auto;

    100%;

    0;

  border-bottom:
    1px solid

    8px;

    850;

    left;

    nowrap;

    800;

    11px;

    hidden;

    flex;

  align-items:
    center;

  gap:
    8px;

  min-width:
    260px;

  height:
    36px;

  padding:
    0 11px;

  background:
    #FFFFFF;

  border:
    1px solid
    var(--border);

  border-radius:
    8px;

}


.audit-search input {

  width:
    100%;

  border:
    0;

  outline:
    0;

  background:
    transparent;

  color:
    var(--text);

  font-size:
    11px;

}


.audit-search input::placeholder {

  color:
    var(--gray-muted-text);

}


.audit-search-icon {

  color:
    var(--gray-title-text);

  font-size:
    14px;

}


/* ---------------------------------------------------------
   EVIDENCE LINKS
   --------------------------------------------------------- */

.documentation-links {

  display:
    flex;

  flex-direction:
    column;

  gap:
    5px;

}


.documentation-link {

  display:
    inline-flex;

  align-items:
    center;

  width:
    fit-content;

  gap:
    5px;

  padding:
    4px 7px;

  border:
    1px solid
    var(--grade-borderline-border);

  border-radius:
    5px;

  background:
    var(--grade-borderline-soft);

  color:
    #9A5700;

  text-decoration:
    none;

  font-size:
    9px;

  font-weight:
    700;

  transition:
    140ms ease;

}


.documentation-link:hover {

  background:
    var(--grade-borderline);

  border-color:
    var(--grade-borderline);

  color:
    #FFFFFF;

}


/* =========================================================
   21. CLICKABLE ROWS
   ========================================================= */

.clickable-row {

  cursor:
    pointer;

}


.clickable-row:hover td {

  color:
    var(--dikichi-ink-deep);

}


/* =========================================================
   22. MODAL
   ========================================================= */

.modal-overlay {

  position:
    fixed;

  inset:
    0;

  z-index:
    1000;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    24px;

  background:
    rgba(43, 18, 51, 0.58);

  backdrop-filter:
    blur(5px);

  opacity:
    0;

  visibility:
    hidden;

  transition:
    180ms ease;

}


.modal-overlay.is-open {

  opacity:
    1;

  visibility:
    visible;

}


.modal {

  width:
    min(980px, 100%);

  max-height:
    min(780px, calc(100vh - 48px));

  overflow:
    hidden;

  display:
    flex;

  flex-direction:
    column;

  background:
    #FFFFFF;

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius-lg);

  box-shadow:
    var(--shadow-lg);

  transform:
    translateY(10px)
    scale(0.985);

  transition:
    180ms ease;

}


.modal-overlay.is-open .modal {

  transform:
    translateY(0)
    scale(1);

}


.modal-header {

  display:
    flex;

  align-items:
    flex-start;

  justify-content:
    space-between;

  gap:
    20px;

  padding:
    20px 22px;

  background:
    var(--dikichi-pink-deep);

  color:
    #FFFFFF;

  border-bottom:
    1px solid
    var(--border);

}


.modal-header h2 {

  margin:
    4px 0 0;

  color:
    var(--dikichi-purple-soft);

  font-size:
    20px;

  letter-spacing:
    -0.03em;

}


.modal-close {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    34px;

  height:
    34px;

  flex:
    0 0 34px;

  border:
    1px solid
    rgba(255,255,255,0.18);

  border-radius:
    8px;

  background:
    rgba(255,255,255,0.07);

  color:
    #FFFFFF;

  font-size:
    21px;

  line-height:
    1;

}


.modal-close:hover {

  background:
    rgba(245,241,223,0.16);

  color:
    var(--dikichi-purple-soft);

}


.modal-body {

  overflow:
    auto;

  padding:
    22px;

}


/* =========================================================
   23. MODAL SUMMARY
   ========================================================= */

.detail-grid {

  display:
    grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap:
    10px;

  margin-bottom:
    20px;

}


.detail-item {

  padding:
    12px;

  background:
    var(--surface-soft);

  border:
    1px solid
    var(--border);

  border-radius:
    9px;

}


.detail-label {

  color:
    var(--gray-title-text);

  font-size:
    8px;

  font-weight:
    850;

  letter-spacing:
    0.08em;

  text-transform:
    uppercase;

}


.detail-value {

  margin-top:
    5px;

  color:
    var(--dikichi-ink-deep);

  font-size:
    13px;

  font-weight:
    700;

  word-break:
    break-word;

}


.feedback-box {

  margin-top:
    18px;

  padding:
    14px;

  background:
    var(--dikichi-purple-light);

  border:
    1px solid
    var(--dikichi-purple-dark-soft);

  border-radius:
    10px;

}


.feedback-label {

  color:
    var(--gray-title-text);

  font-size:
    8px;

  font-weight:
    850;

  letter-spacing:
    0.08em;

  text-transform:
    uppercase;

}


.feedback-text {

  margin-top:
    7px;

  color:
    var(--text-secondary);

  font-size:
    12px;

  line-height:
    1.65;

}


/* =========================================================
   24. TOAST
   ========================================================= */

.toast {

  position:
    fixed;

  right:
    24px;

  bottom:
    24px;

  z-index:
    2000;

  max-width:
    360px;

  padding:
    11px 15px;

  background:
    var(--dikichi-pink-deep);

  color:
    #FFFFFF;

  border:
    1px solid
    rgba(255,255,255,0.08);

  border-radius:
    8px;

  box-shadow:
    var(--shadow-md);

  font-size:
    11px;

  font-weight:
    650;

  opacity:
    0;

  visibility:
    hidden;

  transform:
    translateY(8px);

  transition:
    180ms ease;

}


.toast.is-visible {

  opacity:
    1;

  visibility:
    visible;

  transform:
    translateY(0);

}


/* =========================================================
   25. ERROR STATE
   ========================================================= */

.error-state {

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  min-height:
    240px;

  padding:
    30px;

  text-align:
    center;

}


.error-state-title {

  color:
    var(--grade-middle-fail-text);

  font-size:
    15px;

  font-weight:
    800;

}


.error-state-message {

  max-width:
    560px;

  margin-top:
    7px;

  color:
    var(--text-secondary);

  font-size:
    11px;

}


/* =========================================================
   26. NO DATA STATE
   ========================================================= */

.no-data {

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  min-height:
    160px;

  padding:
    24px;

  text-align:
    center;

}


.no-data-title {

  color:
    var(--dikichi-ink-deep);

  font-size:
    13px;

  font-weight:
    750;

}


.no-data-description {

  max-width:
    420px;

  margin-top:
    5px;

  color:
    var(--gray-title-text);

  font-size:
    10px;

}


/* =========================================================
   27. GENERIC UTILITIES
   ========================================================= */

.muted {

  color:
    var(--gray-title-text);

}


.text-right {

  text-align:
    right !important;

}


.text-center {

  text-align:
    center !important;

}


.hidden {

  display:
    none !important;

}


/* =========================================================
   28. SCROLLBAR
   ========================================================= */

* {

  scrollbar-width:
    thin;

  scrollbar-color:
    #B7C1C8
    transparent;

}


*::-webkit-scrollbar {

  width:
    7px;

  height:
    7px;

}


*::-webkit-scrollbar-track {

  background:
    transparent;

}


*::-webkit-scrollbar-thumb {

  background:
    #B7C1C8;

  border-radius:
    99px;

}


*::-webkit-scrollbar-thumb:hover {

  background:
    var(--dikichi-pink-deep);

}

  }

  }

@media print {

  }

  .period-switcher,

      none;

  }
